name: Add a reel
description: Paste a product link. The site updates itself in about a minute.
title: "Add reel: "
body:
  - type: dropdown
    id: action
    attributes:
      label: Action
      description: Pick "Delete a card" only if you want to remove a card. Then fill in just the Card number below.
      options:
        - Add or update a card
        - Delete a card
      default: 0
  - type: input
    id: card
    attributes:
      label: Card number (optional)
      description: Leave empty to add a new card. To change an existing card, type its number (the #2 on the card). To delete a card, type its number and pick Delete above.
      placeholder: "2"
  - type: input
    id: product
    attributes:
      label: Product link
      description: Needed to add or change a card (not needed to delete). The link people tap to buy. Title, description and image are read from this page.
      placeholder: https://store.com/products/your-product
  - type: input
    id: reel
    attributes:
      label: Reel link (optional)
      description: Your Instagram reel link, or a YouTube Shorts / direct .mp4 link. Leave empty if the product page already has the video.
      placeholder: https://www.instagram.com/reel/XXXXXXXXXXX/
  - type: input
    id: image
    attributes:
      label: Product image link (optional)
      description: Only needed if the card shows a coloured box instead of the product photo. Paste an image address, or the file name of a picture you uploaded into the site folder (like titan.jpg).
      placeholder: https://... or titan.jpg
  - type: input
    id: title
    attributes:
      label: Title (optional)
      description: Only fill this in if you want to replace the title found on the product page.
  - type: textarea
    id: description
    attributes:
      label: Description (optional)
      description: Only fill this in if you want to replace the description found on the product page.
